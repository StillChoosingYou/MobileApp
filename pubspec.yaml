name: pgpc_campus_app
description: "Padre Garcia Polytechnic College — unified campus management app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (Notifier/AsyncNotifier API — no code generation required)
  flutter_riverpod: ^2.4.0

  # Routing
  go_router: ^13.0.0

  # Firebase (wired but inactive until `AppConfig.useFirebase` is switched on —
  # see lib/core/firebase/firebase_init.dart)
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.7.0
  firebase_analytics: ^10.7.0
  firebase_crashlytics: ^3.4.0

  # Local / offline storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0

  # Device capabilities
  local_auth: ^2.1.0
  mobile_scanner: ^3.5.0
  qr_flutter: ^4.1.0
  image_picker: ^1.0.0
  url_launcher: ^6.2.0
  connectivity_plus: ^5.0.0

  # UI / data
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  intl: ^0.18.0
  uuid: ^4.2.0

  # Payments (GCash / Maya via the PayMongo aggregator — see PaymentGatewayService)
  paymongo_sdk: ^0.0.6

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/

  # Bring your own PGPC seal / wordmark into assets/images and uncomment above.
  # If you have a licensed display typeface for the college, drop the .ttf files
  # into assets/fonts and register a `fonts:` block here — otherwise the app
  # uses Google Fonts (Playfair Display + Inter) fetched at build time.
